<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luminaire - {{ category.name }}</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #F5F2EB;
            color: #111827;
        }
    </style>
    <!-- Icons from Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="min-h-screen pb-24 font-sans">

    <!-- Main Content -->
    <main class="px-5 pt-10 pb-32 max-w-4xl mx-auto">
        <!-- Header with Back Button -->
        <header class="flex items-center gap-4 mb-6">
            <a href="/" class="w-10 h-10 rounded-full bg-white border border-gray-200 shadow-sm flex items-center justify-center text-black hover:bg-gray-50 transition-colors">
                <i class="ph ph-arrow-left text-lg"></i>
            </a>
            <div>
                <h1 class="text-2xl font-bold tracking-tight">{{ category.name }}</h1>
                <p class="text-xs text-gray-500">Instant delivery in 8 minutes from Hub #04</p>
            </div>
        </header>

        <!-- Products List Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {% for item in category['items'] %}
            <div class="bg-white rounded-3xl p-5 border border-black/15 shadow-[0_20px_45px_-8px_rgba(0,0,0,0.15)] flex flex-col justify-between">
                <div>
                    <div class="bg-gray-100 rounded-2xl p-3 w-16 h-16 flex items-center justify-center mb-4 border border-gray-200 shadow-sm">
                        <img src="{{ item.icon }}" class="w-full h-full object-contain" alt="{{ item.name }}" />
                    </div>
                    <h4 class="font-bold text-base text-gray-900 mb-1">{{ item.name }}</h4>
                    <p class="text-xs text-gray-500 mb-4">{{ item.desc }}</p>
                </div>
                <div class="flex justify-between items-center pt-4 border-t border-gray-100">
                    <span class="font-bold text-lg text-gray-900">{{ item.price }}</span>
                    <button onclick="alert('{{ item.name }} added to cart!')" class="bg-black text-white px-5 py-2 rounded-xl text-xs font-bold hover:bg-gray-800 transition-colors shadow-sm">
                        Add +
                    </button>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>
    
    <!-- Unified Bottom Navigation -->
    <nav class="fixed bottom-0 w-full bg-[#F5F2EB] border-t border-gray-200 pt-3 pb-6 px-6 flex justify-between items-center z-50">
        <a href="/" class="flex flex-col items-center text-black">
            <i class="ph ph-storefront text-2xl mb-1"></i>
            <span class="text-[10px] font-semibold">Store</span>
        </a>
        <a href="/inventory" class="flex flex-col items-center text-gray-400 hover:text-black transition-colors">
            <i class="ph ph-package text-2xl mb-1"></i>
            <span class="text-[10px] font-semibold">Inventory</span>
        </a>
        <a href="/cart" class="flex flex-col items-center text-gray-400 hover:text-black transition-colors">
            <i class="ph ph-shopping-cart text-2xl mb-1"></i>
            <span class="text-[10px] font-semibold">Cart</span>
        </a>
        <a href="/events" class="flex flex-col items-center text-gray-400 hover:text-black transition-colors">
            <i class="ph ph-calendar-blank text-2xl mb-1"></i>
            <span class="text-[10px] font-semibold">Events</span>
        </a>
    </nav>
</body>
</html>
