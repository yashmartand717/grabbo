<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luminaire - Billing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #FAF8F5; color: #111827; }
    </style>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="min-h-screen pb-24 font-sans">

    <main class="px-5 pt-12 pb-32">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <i class="ph ph-list text-2xl text-gray-800"></i>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Point of Sale</h1>
                <p class="text-xs text-gray-500">Terminal 04 • Cashier: A. Sterling</p>
            </div>
            <div class="w-8 h-8 rounded-full bg-gray-300 overflow-hidden">
                <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=100&q=80" class="w-full h-full object-cover" />
            </div>
        </header>

        <!-- Search & Scan -->
        <div class="flex gap-3 mb-6">
            <div class="relative flex-grow">
                <i class="ph ph-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
                <input type="text" placeholder="Search by SKU..." class="w-full pl-10 pr-4 py-3 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none" />
            </div>
            <button class="bg-white border border-gray-200 px-4 py-3 rounded-xl flex items-center gap-2">
                <i class="ph ph-barcode text-xl"></i>
                <span class="text-sm font-medium">Scan</span>
            </button>
        </div>

        <!-- POS Items Grid -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-white border-2 border-black rounded-2xl p-4 flex flex-col justify-between">
                <div class="bg-gray-100 rounded-xl h-24 mb-3 flex items-center justify-center"><i class="ph ph-box text-3xl text-gray-400"></i></div>
                <h4 class="text-sm font-bold mb-1">Standard Corrugated Box</h4>
                <div class="flex justify-between items-end mt-2">
                    <span class="font-bold">₹450</span>
                    <button class="bg-black text-white rounded-full p-1.5"><i class="ph ph-plus"></i></button>
                </div>
            </div>
            <div class="bg-white border-2 border-black rounded-2xl p-4 flex flex-col justify-between">
                <div class="bg-gray-100 rounded-xl h-24 mb-3 flex items-center justify-center"><i class="ph ph-qr-code text-3xl text-gray-400"></i></div>
                <h4 class="text-sm font-bold mb-1">Thermal Shipping Labels</h4>
                <div class="flex justify-between items-end mt-2">
                    <span class="font-bold">₹2,800</span>
                    <button class="bg-black text-white rounded-full p-1.5"><i class="ph ph-plus"></i></button>
                </div>
            </div>
        </div>

        <!-- Current Order / Cart -->
        <h3 class="text-xl font-bold mb-4">Current Order <span class="text-sm font-normal text-gray-500 float-right mt-1">#ORD-9932</span></h3>
        
        <div class="bg-white rounded-2xl p-5 border border-gray-200 shadow-sm">
            <div class="flex justify-between mb-4 pb-4 border-b border-gray-100">
                <div>
                    <p class="font-bold text-sm">Standard Corrugated Box (M)</p>
                    <p class="text-xs text-gray-500">₹450 / ea</p>
                </div>
                <div class="text-right">
                    <p class="font-bold text-sm mb-2">₹1,350</p>
                    <div class="flex items-center gap-3 bg-gray-100 px-3 py-1 rounded-full">
                        <i class="ph ph-minus text-xs text-gray-500"></i>
                        <span class="text-sm font-bold">3</span>
                        <i class="ph ph-plus text-xs text-gray-500"></i>
                    </div>
                </div>
            </div>

            <div class="pt-2">
                <div class="flex justify-between text-sm mb-2 text-gray-500"><span>Subtotal</span><span class="text-black font-medium">₹4,150</span></div>
                <div class="flex justify-between text-sm mb-2 text-gray-500"><span>Tax (18% GST)</span><span class="text-black font-medium">₹747</span></div>
                <div class="flex justify-between text-2xl font-bold mt-4 pt-4 border-t border-gray-200"><span>Total</span><span>₹4,897</span></div>
            </div>

            <button class="w-full bg-black text-white py-4 rounded-xl font-bold mt-6 flex items-center justify-center gap-2">
                Process Payment <i class="ph ph-arrow-right"></i>
            </button>
        </div>
    </main>

    <!-- Unified Bottom Navigation -->
    <nav class="fixed bottom-0 w-full bg-[#FAF8F5] border-t border-gray-200 pt-3 pb-6 px-6 flex justify-between items-center z-50">
        <a href="/" class="flex flex-col items-center text-gray-400 hover:text-black transition-colors">
            <i class="ph ph-storefront text-2xl mb-1"></i>
            <span class="text-[10px] font-semibold">Store</span>
        </a>
        <a href="/inventory" class="flex flex-col items-center text-gray-400 hover:text-black transition-colors">
            <i class="ph ph-package text-2xl mb-1"></i>
            <span class="text-[10px] font-semibold">Inventory</span>
        </a>
        <a href="/billing" class="flex flex-col items-center text-black">
            <i class="ph ph-money text-2xl mb-1"></i>
            <span class="text-[10px] font-semibold">Billing</span>
        </a>
        <a href="/events" class="flex flex-col items-center text-gray-400 hover:text-black transition-colors">
            <i class="ph ph-calendar-blank text-2xl mb-1"></i>
            <span class="text-[10px] font-semibold">Events</span>
        </a>
    </nav>
</body>
</html>
